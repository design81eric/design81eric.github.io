<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalesProCrm CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--surface:#fff;--ink:#1c2a2d;--muted:#64757a;--line:#dde3df;--accent:#0f5c5a;--accent-ink:#fff;--warn:#a86a0a;--bad:#b23a48;--good:#2f7d4f;--tint:#e8f0ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1516;--surface:#172022;--ink:#e6eeee;--muted:#8fa2a5;--line:#263336;--accent:#4fb3ae;--accent-ink:#06201f;--warn:#e0a548;--bad:#e5707d;--good:#6cc08d;--tint:#1d2c2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1516;--surface:#172022;--ink:#e6eeee;--muted:#8fa2a5;--line:#263336;--accent:#4fb3ae;--accent-ink:#06201f;--warn:#e0a548;--bad:#e5707d;--good:#6cc08d;--tint:#1d2c2d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;padding:0 10px 18px}
nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--tint);color:var(--ink)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav .sp{flex:1}
main{padding:28px 32px 60px;max-width:1280px;width:100%;min-width:0}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar .grow{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto}
.bar input[type=search]{min-width:240px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.strip{display:flex;height:46px;border-radius:8px;overflow:hidden;gap:2px;margin:12px 0 8px}
.strip div{display:flex;align-items:center;padding:0 10px;color:var(--accent-ink);font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--tint)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint)}
.pill.customer{color:var(--good)}.pill.lead{color:var(--warn)}.pill.inactive{color:var(--muted)}
.muted{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(9,230px);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--tint);border-radius:12px;padding:10px;min-height:240px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card b{display:block}
.task{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.task input{width:auto}
.task .t{flex:1;cursor:pointer}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.empty{color:var(--muted);padding:22px 4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:19px}
dialog label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .grow{flex:1}
[hidden]{display:none!important}
.set{margin-bottom:16px;max-width:640px}
.set label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.set .acts{align-items:center;flex-wrap:wrap}
.set p{margin:6px 0 10px}
.set label.chk{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px}
.set label.chk input{width:auto}
.pill.new{color:var(--warn)}.pill.contacted,.pill.qualified,.pill.meeting{color:var(--accent)}.pill.nurture{color:var(--muted)}
.fun{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.fun i{display:block;height:14px;border-radius:4px;background:var(--accent);min-width:2px}
.fun span:last-child{text-align:right;font-weight:600}
.note{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.note span{flex:1}
.fun.b{background:none;border:0;width:100%;text-align:left;cursor:pointer;padding:0;grid-template-columns:120px 1fr 80px}
.fun.b:hover i{opacity:.75}
.fun.on span:first-child{font-weight:700;color:var(--accent)}
.prog{height:10px;background:var(--tint);border-radius:5px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--good)}
.pill.pending,.pill.medium{color:var(--warn)}.pill.progress{color:var(--accent)}.pill.completed,.pill.low{color:var(--good)}.pill.overdue,.pill.high{color:var(--bad)}.pill.cancelled{color:var(--muted)}
.rowbtn{display:flex;gap:6px}.rowbtn .btn{padding:4px 10px;font-size:13px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--tint);font-size:13px;margin:0 6px 6px 0}
.chip.warn{color:var(--warn);font-weight:600}
.rep{margin-bottom:16px}.rep>b{display:block;margin-bottom:6px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(400px,100%)}
.lcard .brand{padding:0 0 14px}
.lcard label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.lcard .chk{display:flex;gap:8px;align-items:center;font-weight:400}
.lcard .chk input{width:auto}
.err{color:var(--bad);min-height:20px;margin:8px 0;font-size:14px}
.demo{margin-top:18px;padding:12px;border-radius:8px;background:var(--tint);font-size:14px;display:grid;gap:6px}
.pill.assigned,.pill.engaged,.pill.meetingbooked{color:var(--accent)}.pill.followup{color:var(--warn)}.pill.converted{color:var(--good)}.pill.disqualified{color:var(--bad)}.pill.unresponsive,.pill.nurturing{color:var(--muted)}
.modg{display:grid;gap:6px;margin-top:12px;text-align:center}.mod{display:block;border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}.mod b,.mod span{display:block}.mod2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ar{text-align:center;color:var(--muted)}
dialog.wide{width:min(660px,94vw);max-height:92vh;overflow:auto}.qg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}.flow div{border-radius:10px;padding:10px 12px;font-size:14px}.flow b,.flow span{display:block}summary{cursor:pointer}
@media (max-width:820px){
.app{grid-template-columns:1fr}
nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:5;align-items:center}
.brand{padding:0 8px 0 4px}nav .sp{display:none}
main{padding:20px 16px 60px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="login" id="login"><div class="lcard"><div class="brand">SalesProCrm</div><h1>Sign in</h1><p class="sub">Use your account to open your contacts, deals, and tasks.</p><form id="lform"><label for="lu">Username</label><input id="lu" autocomplete="username" required><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required><label class="chk"><input type="checkbox" id="show"> Show password</label><div id="lerr" class="err" role="alert"></div><button class="btn" style="width:100%" type="submit">Sign in</button></form><div class="demo"><b>Demo account</b><div>Username: ericson1981</div><div>Password: 1q2w3e4r5t</div><button class="btn ghost" id="demo" type="button">Fill demo account</button></div></div></div>
<div class="app" id="app" hidden>
<nav aria-label="Main">
<div class="brand" id="bname">SalesProCrm</div>
<a href="#leads" data-v="leads">Leads</a>
<a href="#overview" data-v="overview">Dashboard</a>
<a href="#contacts" data-v="contacts">Contacts</a>

</nav>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
(function(){
var KEY="ledgerline.crm.v2",STAGES=["New Lead","Contacted","Qualified","Meeting Scheduled","Meeting Completed","Proposal Sent","Negotiation","Won","Lost"],SLB={Won:"Closed Won",Lost:"Closed Lost"},
ROLE={"New Lead":"SDR / BDR","Contacted":"SDR / BDR","Qualified":"SDR / BDR","Meeting Scheduled":"SDR / AE","Meeting Completed":"AE","Proposal Sent":"AE","Negotiation":"AE","Won":"AE / Manager","Lost":"AE / Manager"},
DESC={"New Lead":"Prospect entered into CRM","Contacted":"Initial outreach completed","Qualified":"Prospect meets qualification criteria","Meeting Scheduled":"Discovery call or demo booked","Meeting Completed":"Discovery and requirements discussed","Proposal Sent":"Commercial proposal delivered","Negotiation":"Pricing and terms discussed","Won":"Deal successfully converted","Lost":"Deal unsuccessful"};
function SL(s){return SLB[s]||s}
var SCOL={Lead:"#8a9a9d",Qualified:"#3f7f9a",Proposal:"#a86a0a",Won:"#2f7d4f",Lost:"#b23a48"};
var money={format:function(v){return new Intl.NumberFormat("en-US",{style:"currency",currency:(S&&S.settings&&S.settings.currency)||"USD",maximumFractionDigits:0}).format(v)}};
function day(o){var d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
var today=day(0);
function seed(){return{contacts:[],deals:[],tasks:[],pipeV:2,settings:{business:"",currency:"USD"}}}
function seedSample(){return{
contacts:[
{id:"c1",name:"Maya Reyes",company:"Harbor Coffee Co.",email:"maya@harborcoffee.example",phone:"+63 917 555 0142",status:"customer",notes:"Prefers email. Renews in March."},
{id:"c2",name:"Daniel Cruz",company:"Northwind Logistics",email:"dcruz@northwind.example",phone:"+63 918 555 0199",status:"lead",notes:"Met at the trade expo."},
{id:"c3",name:"Priya Nair",company:"Bluepine Studio",email:"priya@bluepine.example",phone:"+63 920 555 0171",status:"lead",notes:"Asked about annual pricing."},
{id:"c4",name:"Tomas Villanueva",company:"Sunrise Dental",email:"tomas@sunrisedental.example",phone:"+63 915 555 0108",status:"customer",notes:""},
{id:"c5",name:"Elena Park",company:"Granite Works",email:"elena@graniteworks.example",phone:"+63 919 555 0123",status:"inactive",notes:"Budget frozen until Q2."}],
deals:[
{id:"d1",title:"Annual supply plan",contactId:"c1",value:18000,stage:"Won"},
{id:"d2",title:"Fleet tracking pilot",contactId:"c2",value:24000,stage:"Qualified"},
{id:"d3",title:"Brand site rebuild",contactId:"c3",value:9500,stage:"Proposal"},
{id:"d4",title:"Clinic booking system",contactId:"c4",value:12000,stage:"Proposal"},
{id:"d5",title:"Equipment contract",contactId:"c5",value:30000,stage:"Lost"},
{id:"d6",title:"Intro workshop",contactId:"c3",value:3200,stage:"Lead"}],
tasks:[
{id:"t1",title:"Send proposal to Bluepine",due:day(1),contactId:"c3",done:false},
{id:"t2",title:"Call Daniel about pilot scope",due:day(-1),contactId:"c2",done:false},
{id:"t3",title:"Renewal check-in with Maya",due:day(12),contactId:"c1",done:false},
{id:"t4",title:"Share case study with Tomas",due:day(-3),contactId:"c4",done:true}]}}
var S;
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(!S.settings)S.settings={business:"",currency:"USD"};S.contacts.forEach(function(c){if(c.status==="lead")c.status="new"});if(S.pipeV!==2){S.deals=[];S.pipeV=2}return}}catch(e){}S=seed();sampleAll()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return"x"+Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cname(id){var c=S.contacts.filter(function(x){return x.id===id})[0];return c?c.name:"No contact"}
function fdate(d){return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
var $=function(s){return document.querySelector(s)},main=$("#main"),dlg=$("#dlg");

/* modal */
function modal(title,fields,vals,onSave,onDel){
var h="<h2>"+esc(title)+"</h2>";
fields.forEach(function(f){
var v=vals[f.k]==null?"":vals[f.k];
h+="<label for='f_"+f.k+"'>"+esc(f.label)+"</label>";
if(f.type==="select"){h+="<select id='f_"+f.k+"'>"+f.options.map(function(o){var ov=o.v!==undefined?o.v:o,ol=o.l!==undefined?o.l:o;return"<option value='"+esc(ov)+"'"+(ov==v?" selected":"")+">"+esc(ol)+"</option>"}).join("")+"</select>"}
else if(f.type==="textarea"){h+="<textarea id='f_"+f.k+"' rows='3'>"+esc(v)+"</textarea>"}
else{h+="<input id='f_"+f.k+"' type='"+(f.type||"text")+"' value='"+esc(v)+"'>"}});
h+="<div class='acts'>"+(onDel?"<button class='btn danger' id='mdel'>Delete</button>":"")+"<span class='grow'></span><button class='btn ghost' id='mcancel'>Cancel</button><button class='btn' id='msave'>Save</button></div>";
dlg.className="";dlg.innerHTML=h;
$("#mcancel").onclick=function(){dlg.close()};
if(onDel)$("#mdel").onclick=function(){if(confirm("Delete this item? This can’t be undone.")){onDel();dlg.close()}};
$("#msave").onclick=function(){var o={};var ok=true;fields.forEach(function(f){var el=$("#f_"+f.k);o[f.k]=el.value.trim();if(f.req&&!o[f.k]){ok=false;el.style.borderColor="var(--bad)"}});if(!ok)return;onSave(o);dlg.close()};
dlg.showModal();var first=dlg.querySelector("input,select");if(first)first.focus()}

/* contacts */
var CF=[{k:"name",label:"Name",req:1},{k:"company",label:"Company"},{k:"email",label:"Email",type:"email"},{k:"phone",label:"Phone"},{k:"status",label:"Lead status",type:"select",options:[{v:"new",l:"New"},{v:"contacted",l:"Contacted"},{v:"qualified",l:"Qualified"},{v:"meeting",l:"Meeting booked"},{v:"customer",l:"Customer"},{v:"nurture",l:"Nurture"},{v:"inactive",l:"Inactive"}]},{k:"owner",label:"Owner (assigned automatically if blank)"},{k:"source",label:"Lead source (for example Referral, Website, Event)"},{k:"campaign",label:"Campaign"},{k:"created",label:"Date added",type:"date"},{k:"attempts",label:"Contact attempts",type:"number"},{k:"firstContact",label:"First contacted on",type:"date"},{k:"meeting",label:"Meeting",type:"select",options:[{v:"",l:"None"},{v:"booked",l:"Booked"},{v:"held",l:"Held"}]},{k:"notes",label:"Notes",type:"textarea"}];
function editContact(id){
var c=id?S.contacts.filter(function(x){return x.id===id})[0]:{status:"new",created:today,attempts:0,meeting:""};
modal(id?"Edit contact":"Add contact",CF,c,function(o){
o.attempts=Number(o.attempts)||0;if(!o.created)o.created=today;if(id){Object.assign(c,o)}else{o.id=uid();S.contacts.unshift(o)}save();route()},
id?function(){S.contacts=S.contacts.filter(function(x){return x.id!==id});S.deals.forEach(function(d){if(d.contactId===id)d.contactId=""});S.tasks.forEach(function(t){if(t.contactId===id)t.contactId=""});save();route()}:null)}
function contactOpts(){return[{v:"",l:"No contact"}].concat(S.contacts.map(function(c){return{v:c.id,l:c.name}}))}

function vContacts(){
main.innerHTML="<h1>Contacts</h1><p class='sub'>Everyone you work with, in one place.</p><div class='bar'><input type='search' id='q' placeholder='Search name, company, email' aria-label='Search contacts'><select id='st' aria-label='Filter by status'><option value=''>All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>meeting</option><option>customer</option><option>nurture</option><option>inactive</option></select><span class='grow'></span><button class='btn' id='add'>Add contact</button></div><div class='panel tablewrap'><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Status</th><th>Open deals</th></tr></thead><tbody id='rows'></tbody></table></div>";
function rows(){
var q=$("#q").value.toLowerCase(),st=$("#st").value;
var l=S.contacts.filter(function(c){return(!st||c.status===st)&&(c.name+c.company+c.email).toLowerCase().indexOf(q)>-1});
$("#rows").innerHTML=l.length?l.map(function(c){
var n=S.deals.filter(function(d){return d.contactId===c.id&&d.stage!=="Won"&&d.stage!=="Lost"}).length;
return"<tr data-id='"+c.id+"' tabindex='0'><td><b>"+esc(c.name)+"</b></td><td>"+esc(c.company)+"</td><td class='muted'>"+esc(c.email)+"</td><td><span class='pill "+c.status+"'>"+c.status+"</span></td><td>"+n+"</td></tr>"}).join(""):"<tr><td colspan='5' class='empty'>No contacts match. Clear the search or add a new contact.</td></tr>"}
$("#q").oninput=rows;$("#st").onchange=rows;$("#add").onclick=function(){editContact()};
$("#rows").onclick=function(e){var tr=e.target.closest("tr[data-id]");if(tr)editContact(tr.dataset.id)};
$("#rows").onkeydown=function(e){if(e.key==="Enter"){var tr=e.target.closest("tr[data-id]");if(tr)editContact(tr.dataset.id)}};
rows()}

/* pipeline */
function editDeal(id,stage){
var d=id?S.deals.filter(function(x){return x.id===id})[0]:{stage:stage||"New Lead",contactId:""};
var F=[{k:"title",label:"Deal name",req:1},{k:"contactId",label:"Contact",type:"select",options:contactOpts()},{k:"value",label:"Deal value",type:"number"},{k:"stage",label:"Stage",type:"select",options:STAGES.map(function(g){return{v:g,l:SL(g)}})},{k:"lostReason",label:"Reason lost (for Closed Lost deals)",type:"select",options:[{v:"",l:"Not applicable"},"Price","Chose a competitor","No budget","No decision","Bad timing","Other"]}];
modal(id?"Edit deal":"Add deal",F,d,function(o){o.value=Number(o.value)||0;if(o.stage==="Lost"&&!o.lostReason)o.lostReason="Not recorded";if(o.stage!=="Lost")o.lostReason="";if(id){Object.assign(d,o)}else{o.id=uid();o.created=today;S.deals.push(o)}save();route()},
id?function(){S.deals=S.deals.filter(function(x){return x.id!==id});save();route()}:null)}
function vPipeline(){
main.innerHTML="<h1>Pipeline</h1><p class='sub'>Drag a deal to a new stage as it moves.</p><div class='bar'><span class='grow'></span><button class='btn' id='add'>Add deal</button></div><div class='board' id='board'></div>";
$("#add").onclick=function(){editDeal()};
$("#board").innerHTML=STAGES.map(function(s){
var ds=S.deals.filter(function(d){return d.stage===s}),tot=ds.reduce(function(a,d){return a+d.value},0);
return"<div class='col' data-s='"+s+"'><h3><span>"+SL(s)+"</span><span class='muted'>"+money.format(tot)+"</span></h3><div class='muted' style='font-size:12px;margin:0 4px 10px'>"+DESC[s]+"<br>Owner: "+ROLE[s]+"</div>"+ds.map(function(d){
