<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contable App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f4c75;--blue:#3282b8;--sky:#bbe1fa;--ink:#1b262c;--bg:#f8f8f8;--card:#fff;--grey:#c4c4c4;--mute:#464858;--row:#f1f6fa;--shadow:0 4px 4px rgba(0,0,0,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eef2;--bg:#11171b;--card:#1b262c;--mute:#aab4bd;--row:#233039;--grey:#4a565e;--sky:#2a5a7d}}
:root[data-theme="dark"]{--ink:#e8eef2;--bg:#11171b;--card:#1b262c;--mute:#aab4bd;--row:#233039;--grey:#4a565e;--sky:#2a5a7d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,system-ui,sans-serif;font-weight:700;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* layout */
.app{display:grid;grid-template-columns:325px 1fr;min-height:100vh}
aside{background:var(--navy);border-top-right-radius:50px;padding:80px 0 40px 35px;color:#fff}
.logo{font-size:36px;margin:0 0 60px 76px}
aside a{display:block;color:#fff;text-decoration:none;font-size:18px;padding:30px 0 30px 89px;margin-bottom:-6px;border-radius:50px 0 0 50px}
aside a.on{background:var(--sky);color:var(--navy)}
:root[data-theme="dark"] aside a.on,@media (prefers-color-scheme:dark){}
main{padding:46px 40px 60px 70px;max-width:1115px;width:100%}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px;gap:16px}
h1{font-size:36px;margin:30px 0 0;text-transform:uppercase}
.user{display:flex;gap:14px;align-items:center}
.av{width:55px;height:55px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:grid;place-items:center;font-size:20px}
.user small{display:block;color:var(--navy);font-size:14px}
:root[data-theme="dark"] .user small{color:var(--sky)}
.card{background:var(--card);border-radius:25px;box-shadow:var(--shadow);padding:30px 45px}
.sub{font-size:18px}
/* home */
.toggle{display:flex;background:var(--grey);border-radius:50px;padding:3px;gap:0}
.toggle button{border:0;background:none;border-radius:50px;padding:3px 30px;font-size:18px;cursor:pointer}
.toggle .on{background:var(--card)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.stats{display:flex;gap:70px;margin:42px 0 30px}
.stats div{min-width:94px}.stats b{font-size:24px;display:block;margin-top:2px}
.stats .a{border-top:5px solid var(--navy);border-radius:50px;padding-top:0}
.stats span{font-size:18px}
.chart{position:relative;height:230px;margin-right:45px}
.grid{position:absolute;inset:0 0 0 0}
.grid i{position:absolute;left:0;right:0;height:1px;background:var(--grey)}
.grid em{position:absolute;right:-45px;font-style:normal;font-size:13px;color:var(--mute);transform:translateY(-50%)}
.bars{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}
.bars b{width:30px;background:var(--grey);transition:height .5s;cursor:pointer}
.bars b.n{background:var(--navy)}.bars b.m{background:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1.77fr;gap:35px;margin-top:40px}
.two .card{padding:22px 24px;min-height:246px}
.two ol,.two ul{list-style:none;margin:18px 0 0;padding:0 0 0 14px;font-size:22px}
.two li{margin-bottom:14px}
/* tables */
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 22px;flex-wrap:wrap;gap:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:50px;padding:7px 28px;font-size:18px;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.btn.ghost{background:var(--grey);color:#1b262c}
.btn:hover{background:var(--blue)}
.tabs{position:relative;display:inline-block}
.tabs>button{background:var(--sky);border:0;border-radius:12px;padding:8px 18px;font-size:22px;cursor:pointer;color:var(--ink)}
.menu{position:absolute;top:100%;left:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:8px;z-index:5;min-width:200px}
.menu div{padding:8px 12px;cursor:pointer;border-radius:8px;font-size:16px}
.menu div:hover{background:var(--row)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:640px}
th{background:var(--sky);padding:14px 20px;text-align:left;font-size:16px;color:#1b262c}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td{background:var(--card);padding:22px 20px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
.ic{border:0;background:none;cursor:pointer;font-size:18px;padding:2px 6px}
.pill{background:var(--sky);color:#1b262c;padding:2px 12px;border-radius:50px;font-size:14px}
/* forms */
.f{display:grid;grid-template-columns:1fr 1fr;gap:20px 50px}
.f label{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;font-size:16px}
.f label.w{grid-column:1/-1}
input,select,textarea{border:1px solid var(--grey);background:var(--card);border-radius:8px;padding:6px 10px;width:100%;font-weight:400}
.rows input{padding:4px 8px}
.rows{width:100%;border-collapse:collapse;min-width:720px;margin-top:20px}
.rows th{border-radius:0}
.rows td{box-shadow:none;border-bottom:1px solid var(--grey);padding:8px}
.tot{margin:20px 0 0 auto;width:260px;font-size:16px}
.tot p{display:flex;justify-content:space-between;margin:8px 0}
.act{display:flex;justify-content:flex-end;gap:14px;margin-top:30px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{width:min(520px,100%)}
.modal label{display:block;margin:12px 0 4px;font-size:15px}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:min(500px,100%);padding:50px 55px;text-align:center}
.auth h2{font-size:20px;margin:0 0 40px}
.auth input{padding:14px 18px;margin-bottom:20px;border-radius:12px}
.auth .btn{width:100%;justify-content:center;border-radius:14px;padding:12px;font-size:24px}
.auth a{color:var(--blue);cursor:pointer;text-decoration:none}
.demo{background:var(--row);border:1px dashed var(--blue);border-radius:12px;padding:12px 16px;margin:0 0 20px;display:grid;gap:4px;font-size:15px;text-align:left}
.demo code{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--blue)}
.demo button{margin-top:6px;border:0;background:var(--sky);color:#1b262c;border-radius:50px;padding:6px 14px;cursor:pointer;font-size:14px}
/* POS */
.pos{min-height:100vh;display:flex;flex-direction:column}
.pos nav{background:var(--navy);color:#fff;padding:26px 50px;font-size:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pos nav a{color:#fff;font-size:16px;text-decoration:none;cursor:pointer}
.posb{display:grid;grid-template-columns:1.3fr 1fr;flex:1}
.posb section{padding:28px 40px}
.posb .r{background:var(--card);box-shadow:-2px 0 6px rgba(0,0,0,.15);display:flex;flex-direction:column}
.prod{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:20px 24px;margin-top:14px;cursor:pointer;gap:12px}
.prod:hover{background:var(--row)}
.line{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--grey);font-size:16px;gap:8px}
.sold{margin-top:auto;display:flex;justify-content:space-between;padding:20px 0;font-size:20px;border-top:3px solid var(--grey)}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{border-radius:0 0 30px 0;padding:20px 12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
 .logo{margin:0 20px 0 10px;font-size:26px}
 aside a{padding:10px 16px;margin:0;border-radius:50px;font-size:14px}
 main{padding:24px 16px}h1{font-size:26px;margin:0}
 .card{padding:20px}.stats{gap:30px}.two,.f,.posb{grid-template-columns:1fr}
 .f label{grid-template-columns:100px 1fr}.chart{margin-right:34px}.bars b{width:5%}
 .grid em{right:-34px}.pos nav{padding:18px 20px;font-size:24px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>'$'+Number(n).toLocaleString('en-US');
let range='Month', vtab='Invoices', modal=false, menu=false;
const contacts=[{n:'Victor Manuel',t:'1122408617',p:'314502365',o:'Frequent customer'},{n:'Good Shoes',t:'running',p:'314502365',o:'Ewdgbsbdf'},{n:'Laura Barahona',t:'1122408617',p:'3145063321',o:'—'}];
const products=[{r:'12452365441',n:'Website',p:750000},{r:'12452365442',n:'Web service',p:320000},{r:'12452365443',n:'Annual hosting',p:180000}];
const data={Month:[60,83,192,60,94,42,164,152,124,60,72,113,192],'1 Year':[120,90,210,140,80,170,200,110,95,160,190,130,220],'2 Years':[90,150,130,200,170,110,140,230,180,100,120,210,160]};
const hl={Month:{2:'n',6:'m',7:'m',8:'n',12:'n'},'1 Year':{2:'n',6:'n',11:'m'},'2 Years':{3:'n',7:'n',12:'m'}};
const quotes=[['101','Laura Barahona','12/07/2020','15/07/2020','active',1020000]];
const invoices=[['1','Good Shoes','running','314502365','Ewdgbsbdf'],['2','Laura Barahona','1122408617','3145063321','Payment pending']];
const cart=[];
const nav=[['home','HOME'],['contactos','CONTACTS'],['ventas','SALES'],['inventarios','INVENTORY'],['config','SETTINGS']];
const route=()=>(location.hash||'#login').slice(1);
function shell(cur,title,body){
 return `<div class="app"><aside><h2 class="logo">LOGO</h2>${nav.map(([h,l])=>`<a href="#${h}" class="${h===cur?'on':''}">${l}</a>`).join('')}</aside>
 <main><header><h1>${title}</h1><div class="user"><div><div>Ericson Palaganas</div><small>ROLE</small></div><div class="av">EP</div><a href="#login" style="font-size:14px;color:var(--blue);text-decoration:none">Log out</a></div></header>${body}</main></div>`;
}
function home(){
 const d=data[range],max=250;
 return shell('home','Activity',`<div class="card"><div class="top"><span class="sub">January 2020 - February 2020</span>
 <div class="toggle">${['Month','1 Year','2 Years'].map(r=>`<button class="${r===range?'on':''}" data-r="${r}">${r}</button>`).join('')}</div></div>
 <div class="stats"><div class="a"><span>Contacts</span><b>${contacts.length*41000}</b></div><div><span>Sales</span><b style="color:var(--mute)">2300</b></div></div>
 <div class="chart"><div class="grid">${[0,50,100,150,200,250].map(v=>`<i style="bottom:${v/max*100}%"></i><em style="bottom:${v/max*100}%">${v}</em>`).join('')}</div>
 <div class="bars">${d.map((v,i)=>`<b class="${hl[range][i]||''}" style="height:${v/max*100}%" title="${v}"></b>`).join('')}</div></div></div>
 <div class="two"><div class="card"><span class="sub">New Quotes</span><ol>${['Sale of HP ...','Sale of Headphones','HP Laptop...'].map((x,i)=>`<li>${i+1}. ${x}</li>`).join('')}</ol></div>
 <div class="card"><span class="sub">Latest products</span><ul>${products.map(p=>`<li>${p.n} ${p.r.slice(0,5)}.</li>`).join('')}<li>Hp pavilion h2342wfwg sdg aeg err</li></ul></div></div>`);
}
function contactos(){
 return shell('contactos','Customers',`<div class="bar"><span></span><button class="btn" id="addc">＋ Add new Contact</button></div>
 <div class="tw"><table><tr><th>Name</th><th>Tax ID</th><th>Phone</th><th>Notes</th><th>Actions</th></tr>
 ${contacts.map((c,i)=>`<tr><td>${c.n}</td><td>${c.t}</td><td>${c.p}</td><td>${c.o}</td><td><button class="ic" title="Edit">✏️</button><button class="ic" data-del="${i}" title="Delete">🗑️</button></td></tr>`).join('')}</table></div>
 ${modal?`<div class="modal"><div class="card"><h2 style="margin-top:0">New contact</h2>
 <label>Name</label><input id="mn"><label>Tax ID</label><input id="mt"><label>Phone</label><input id="mp"><label>Notes</label><input id="mo">
 <div class="act"><button class="btn ghost" id="mc">Cancel</button><button class="btn" id="ms">Save</button></div></div></div>`:''}`);
}
function ventas(){
 const head=vtab==='Quotes'?['Number','Customer','Created','Due date','Status','Total','Actions']:['Number','Name','Tax ID','Phone','Notes','Actions'];
 const rows=vtab==='Quotes'?quotes.map(q=>`<td>${q[0]}</td><td>${q[1]}</td><td>${q[2]}</td><td>${q[3]}</td><td><span class="pill">${q[4]}</span></td><td>${fmt(q[5])}</td>`):invoices.map(r=>r.map(c=>`<td>${c}</td>`).join(''));
 return shell('ventas','Sales',`<div class="bar"><div class="tabs"><button id="tb">${vtab} ▾</button>${menu?`<div class="menu">${['Invoices','Recurring Invoices','Quotes'].map(t=>`<div data-t="${t}">${t}</div>`).join('')}</div>`:''}</div>
 <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn ghost" href="#facturador" style="text-decoration:none">Point of sale</a><a class="btn" href="#nueva" style="text-decoration:none">＋ Add new ${vtab==='Quotes'?'quote':'invoice'}</a></div></div>
 <div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r}<td><button class="ic">✏️</button><button class="ic">🗑️</button></td></tr>`).join('')}</table></div>`);
}
function nueva(){
 return shell('ventas','New invoice',`<div class="card"><div class="f">
 <label>Contact *<select>${contacts.map(c=>`<option>${c.n}</option>`).join('')}</select></label><label>Date *<input type="date" value="2020-07-01"></label>
 <label>ID<input></label><label>Payment type *<select><option>Cash</option><option>Credit</option></select></label>
 <label>Phone<input></label><label>Term *<input type="date" value="2020-08-08"></label>
 <span></span><label>Due date *<input type="date" value="2020-08-08"></label></div>
 <div class="tw"><table class="rows" id="items"><tr><th>Item</th><th>Reference</th><th>Price</th><th>Disc%</th><th>Tax</th><th>Description</th><th>Quantity</th><th>Total</th><th></th></tr></table></div>
 <button class="btn" id="addrow" style="margin-top:16px">＋ Add new row</button>
 <div class="tot"><p>Subtotal <span id="s1">$0</span></p><p>Discount <span id="s2">$0</span></p><p>Total <b id="s3">$0</b></p></div>
 <div class="f" style="margin-top:20px"><label class="w" style="grid-template-columns:1fr"><span>Terms and conditions</span><textarea rows="2"></textarea></label></div>
 <div class="act"><a class="btn ghost" href="#ventas" style="text-decoration:none">Cancel</a><button class="btn ghost">Preview</button><button class="btn" id="save">Save</button></div></div>`);
}
function stub(cur,t){return shell(cur,t,`<div class="card"><p>Coming soon.</p></div>`)}
function facturador(){
 const tot=cart.reduce((a,c)=>a+c.p*c.q,0);
 return `<div class="pos"><nav><span>Cashier</span><span style="font-size:16px;display:flex;gap:20px;align-items:center"><a href="#ventas">← Back</a>Ericson Palaganas</span></nav><div class="posb">
 <section><input placeholder="🔍 Search products" style="padding:12px 16px;font-size:18px;border-radius:12px">
 ${products.map((p,i)=>`<div class="prod" data-p="${i}"><span>${p.r}</span><span>${p.n}</span><span>${fmt(p.p)}</span><span style="color:var(--blue);font-size:26px">★</span></div>`).join('')}</section>
 <section class="r"><div class="top"><span class="sub">Customers</span><a style="color:var(--blue);font-size:14px">add</a></div>
 <div style="margin:14px 0;border-bottom:3px solid var(--grey)"><select>${contacts.map(c=>`<option>${c.n}</option>`).join('')}</select><br><br></div>
 ${cart.length?cart.map((c,i)=>`<div class="line"><span>${c.n}</span><span>${c.q} × ${fmt(c.p)}</span><b>${fmt(c.p*c.q)}</b><button class="ic" data-rm="${i}">🗑️</button></div>`).join(''):'<p style="color:var(--mute)">Tap a product to add it.</p>'}
 <div class="sold"><span>Sold</span><b>${fmt(tot)}</b></div>
 <div class="act" style="margin:0"><button class="btn ghost" id="clr">Cancel Current</button><button class="btn" id="pay">Charge</button></div></section></div></div>`;
}
function auth(reg){
 return `<div class="auth"><div class="card"><h2>${reg?'Sign Up':'Sign in to access your latest data!'}</h2>
 <input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><p id="err" style="color:#c0392b;font-size:14px;margin:-8px 0 12px;min-height:18px"></p>${reg?'':'<div class="demo"><b>Demo account</b><span>Username: <code>EricsonPalaganas</code></span><span>Password: <code>1q2w3e4r5t</code></span><button type="button" id="fill">Fill in demo login</button></div>'}${reg?'<input type="password" placeholder="Confirm Password"><input placeholder="Nickname">':''}
 <button class="btn" id="go">${reg?'Sign Up':'Sign In'}</button><p>${reg?'Already have an account? <a href="#login">Sign In</a>':'No account yet? <a href="#registro">Sign Up</a>'}</p>${reg?'':'<p><a>Forgot your password?</a></p>'}</div></div>`;
}
function rowTpl(){
 return `<tr><td><select class="it">${products.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('')}</select></td><td class="rf"></td><td class="pr"></td><td><input class="ds" value="0" style="width:60px"></td><td>0%</td><td><input></td><td><input class="qt" value="1" style="width:60px"></td><td class="tt"></td><td><button class="ic rm">🗑️</button></td></tr>`;
}
function recalc(){
 let s=0,d=0;
 document.querySelectorAll('#items tr:not(:first-child)').forEach(r=>{
  const p=products[r.querySelector('.it').value],q=+r.querySelector('.qt').value||0,ds=+r.querySelector('.ds').value||0;
  r.querySelector('.rf').textContent=p.r;r.querySelector('.pr').textContent=fmt(p.p);
  const gross=p.p*q,disc=gross*ds/100;s+=gross;d+=disc;r.querySelector('.tt').textContent=fmt(gross-disc);
 });
 $('#s1').textContent=fmt(s);$('#s2').textContent=fmt(d);$('#s3').textContent=fmt(s-d);
}
function render(){
 const r=route(),root=$('#root');
 if(r==='login')setAuth(false);
 if(r!=='login'&&r!=='registro'&&!authed()){location.hash='#login';return}
 root.innerHTML=({login:()=>auth(0),registro:()=>auth(1),home,contactos,ventas,nueva,facturador,inventarios:()=>stub('inventarios','Inventory'),config:()=>stub('config','Settings')}[r]||home)();
 bind(r);
}
function bind(r){
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{range=b.dataset.r;render()});
 const go=$('#go');
 if(go&&r==='registro')go.onclick=()=>location.hash='#login';
 if(go&&r==='login'){
  const attempt=async()=>{
   let ok=false;try{ok=sha($('#lu').value.trim()+':'+$('#lp').value)===HASH}catch(e){}
   if(ok){setAuth(true);location.hash='#home'}else{$('#err').textContent='Incorrect username or password.'}
  };
  go.onclick=attempt;
  $('#fill').onclick=()=>{$('#lu').value='EricsonPalaganas';$('#lp').value='1q2w3e4r5t';$('#err').textContent=''};
  document.querySelectorAll('#lu,#lp').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')attempt()}));
 }
 if(r==='contactos'){
  $('#addc').onclick=()=>{modal=true;render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{contacts.splice(+b.dataset.del,1);render()});
  if(modal){$('#mc').onclick=()=>{modal=false;render()};
   $('#ms').onclick=()=>{const n=$('#mn').value.trim();if(!n){$('#mn').focus();return}contacts.push({n,t:$('#mt').value,p:$('#mp').value,o:$('#mo').value});modal=false;render()}}
 }
 if(r==='ventas'){
  $('#tb').onclick=()=>{menu=!menu;render()};
  document.querySelectorAll('[data-t]').forEach(m=>m.onclick=()=>{vtab=m.dataset.t;menu=false;render()});
 }
 if(r==='nueva'){
  const t=$('#items'),add=()=>{t.insertAdjacentHTML('beforeend',rowTpl());recalc()};add();
  $('#addrow').onclick=add;
  t.addEventListener('input',recalc);t.addEventListener('change',recalc);
  t.addEventListener('click',e=>{if(e.target.classList.contains('rm')){e.target.closest('tr').remove();recalc()}});
  $('#save').onclick=()=>{invoices.push([String(invoices.length+1),'New invoice','—','—',$('#s3').textContent]);location.hash='#ventas'};
 }
 if(r==='facturador'){
  document.querySelectorAll('[data-p]').forEach(p=>p.onclick=()=>{const x=products[+p.dataset.p],f=cart.find(c=>c.n===x.n);f?f.q++:cart.push({n:x.n,p:x.p,q:1});render()});
