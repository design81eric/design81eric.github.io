<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRM – Customer Reviews Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#f8f4f3;--card:#db9c9c;--ink:#111;--accent:#1e9bf0;--mute:#8794a8;--line:#222;--btn:#d9d9d9;--cardink:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1f2227;--card:#8a5a5a;--ink:#f2f2f2;--accent:#5ab8ff;--mute:#8e98a8;--line:#ccc;--btn:#3a3d44;--cardink:#fff}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1f2227;--card:#8a5a5a;--ink:#f2f2f2;--accent:#5ab8ff;--mute:#8e98a8;--line:#ccc;--btn:#3a3d44;--cardink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:15px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{padding:26px 22px;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.06)}
.logo{font-size:30px;color:var(--accent);margin-bottom:56px}
aside a{color:var(--accent);text-decoration:none;font-weight:500;font-size:14px;padding:12px 8px;border-radius:8px;display:block}
aside a.on,aside a:hover{background:var(--panel)}
.tog{margin-top:auto;background:none;border:0;color:var(--mute);font:500 15px Poppins;text-align:left;cursor:pointer;padding:8px}
main{padding:28px 36px;min-width:0}
.top{display:flex;justify-content:flex-end;gap:32px;font-weight:500;font-size:14px;margin-bottom:40px}
.top a{color:var(--ink);text-decoration:none}
.panel{background:var(--panel);border:1px solid var(--line);padding:22px;min-height:560px}
h1{font-weight:400;font-size:22px;margin:0 0 24px}
.bar{display:flex;gap:16px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-bottom:18px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--btn);border:0;padding:9px 12px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{display:grid;gap:16px;align-content:start}
.card{background:var(--card);color:var(--cardink);padding:20px 22px;text-transform:uppercase;font-size:17px}
.card b{display:block;font-weight:400;font-size:22px;margin-top:28px;text-transform:none}
.btn{background:var(--btn);color:var(--ink);border:0;padding:12px 28px;border-radius:10px;font:500 14px Poppins;cursor:pointer}
.btn.p{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;padding:10px}
td{padding:14px 10px}
tbody tr:nth-child(odd){background:var(--btn)}
.chips{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.chip{background:var(--btn);padding:8px 26px;border-radius:40px}
.list{display:grid;gap:14px}
.item{background:var(--btn);padding:14px 18px;border-radius:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item small{color:var(--mute)}
.form{max-width:480px;display:grid;gap:14px}
.form input{padding:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .panel{width:min(560px,100%);min-height:0;padding:36px}
.chat{display:grid;grid-template-columns:240px 1fr;gap:16px}
.chat>div{background:var(--btn);padding:14px;border-radius:8px;min-height:400px}
.msg{padding:8px 12px;border-radius:12px;background:var(--panel);margin:8px 0;max-width:80%}
.msg.me{margin-left:auto;background:var(--accent);color:#fff}
.sw{width:46px;height:26px;border-radius:20px;background:var(--btn);border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.sid.hide aside{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;gap:4px;padding:14px}.logo{margin:0 12px 0 0;font-size:24px}.tog{display:none}main{padding:16px}.grid,.chat{grid-template-columns:1fr}.top{margin-bottom:18px}.panel{overflow-x:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var NAV=[["dashboard","Dashboard"],["reviews","Customer Review Listing"],["tasks","Task Management"],["chat","Chat"],["settings","Settings"],["support","App Support"]];
var REV=[["Andy",4.3,"Great app, very smooth","15 May 2022","Apple","Yet To Check"],["Parry",4.1,"Love the new update","21 Jan 2022","Google Store","Checked"],["Ben",3.2,"Needs better search","20 Dec 2021","Apple","In Process"]];
var TASKS={"Yet to Check":[["Ticket #4301","4.3","15 May 2022"],["Ticket #4288","4.1","12 May 2022"]],"In Process":[["Ticket #4120","3.1","18 Mar 2022"]],"Checked":[["Ticket #4207","4.8","17 Apr 2022"]]};
var NOTES=[["Unread","New review received","10 mins. ago"],["Unread","Task assigned to you","1 hr. ago"],["Read","Weekly report ready","2 days ago"]];
var CHATS={Alex:["Hi, any update on the latest reviews?","Alex"],Tracy:["Task #4120 is in process.","Tracy"],Ravi:["Sharing the churn report now.","Ravi"]};
var USER={id:"12454",name:"Ericson Palaganas",email:"ericson@enterprise.com",role:"Product Manager",loc:"CA"};
var notifOn=true,editing=false,chatWith="Alex",msgs=[];
function $(s){return document.querySelector(s)}
function shell(inner,cur){
  var nav=NAV.map(function(n){return '<a href="#'+n[0]+'" class="'+(n[0]===cur?'on':'')+'">'+n[1]+'</a>'}).join("");
  return '<div class="app"><aside><div class="logo">CRM</div>'+nav+'<button class="tog" onclick="document.body.classList.toggle(\'sid\')">Toggle Sidebar</button></aside><main><div class="top"><a href="#notifications">Notifications</a><a href="#profile">Profile</a><a href="#login">Logout</a></div><div class="panel">'+inner+'</div></main></div>';
}
var V={
login:function(){return '<div class="login"><div class="panel"><h1>Login</h1><div class="form"><input id="u" placeholder="Enter Emp.Id (or) Emp Email"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key===\'Enter\')doLogin()"><div id="err" style="color:#d33;font-size:13px"></div><div style="background:var(--btn);padding:12px 14px;border-radius:8px;font-size:13px"><b>Demo login</b><br>Username: Ericson Palaganas<br>Password: 1q2w3e4r5t<br><button class="btn" style="margin-top:8px;padding:6px 14px;font-size:12px" onclick="$(\'#u\').value=\'Ericson Palaganas\';$(\'#p\').value=\'1q2w3e4r5t\'">Use demo login</button></div><a href="#forgot" style="color:var(--accent);text-align:right">Forgot Password</a><div style="display:flex;gap:16px"><button class="btn p" onclick="doLogin()">Login</button><button class="btn" onclick="$(\'#u\').value=\'\';$(\'#p\').value=\'\'">Cancel</button></div></div></div></div>'},
forgot:function(){return '<div class="login"><div class="panel"><h1>Forgot Password</h1><div class="form"><input placeholder="Emp. Id"><input placeholder="Emp. Email"><p style="font-size:13px;color:var(--mute);margin:0">An OTP code will be sent to your registered Emp. Email Id.</p><input placeholder="OTP Code"><input type="password" placeholder="New Password"><input type="password" placeholder="Confirm New Password"><div style="display:flex;gap:16px"><button class="btn p" onclick="location.hash=\'login\'">Submit</button><button class="btn" onclick="location.hash=\'login\'">Cancel</button></div></div></div></div>'},
dashboard:function(){
  var c=function(t,v){return '<div class="card">'+t+'<b>'+v+'</b></div>'};
  return shell('<div class="bar"><select><option>APP STORE</option><option>GOOGLE STORE</option></select><span>📅 From – To Date &amp; Year</span></div><div class="grid"><div class="col">'+c("Overall app ratings","4.5 ★")+c("Total no. of app downloads","50105")+c("New app downloads","10K+")+'</div><div class="col"><div class="card">Churn rate<b>85%</b><svg viewBox="0 0 240 110" width="100%" height="130"><g fill="#10e0b0"><rect x="60" y="60" width="14" height="30"/><rect x="85" y="50" width="14" height="40"/><rect x="110" y="35" width="14" height="55"/><rect x="135" y="25" width="14" height="65"/><rect x="160" y="15" width="14" height="75"/></g><rect x="10" y="90" width="14" height="12" fill="#f0258c"/><polyline points="10,100 60,85 110,50 160,30 200,10" fill="none" stroke="#1a2a6c" stroke-width="3"/><span>By 10%</span></svg>By 10%</div><div class="card">App users – growth &amp; decline rate<svg viewBox="0 0 240 130" width="100%" height="170" style="margin-top:20px"><g stroke="#f5d442"><path d="M0 20H240M0 45H240M0 70H240M0 95H240"/></g><g fill="#fdc92d" stroke="#111" stroke-width="2"><rect x="20" y="55" width="40" height="65"/><rect x="85" y="80" width="40" height="40"/><rect x="150" y="25" width="40" height="95"/></g><path d="M5 5V122H230" stroke="#111" stroke-width="2" fill="none"/></svg></div></div></div>',"dashboard")},
reviews:function(){return shell('<h1>Customer Review Listing</h1><div class="bar"><input id="q" placeholder="Search…" oninput="filt()"><button class="btn">Filter</button><button class="btn" onclick="exp()">Export</button></div><div style="overflow-x:auto"><table><thead><tr><th>Customer Name</th><th>Ratings</th><th>Reviews</th><th>Date and Year</th><th>Store</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div><p style="text-align:center;margin-top:24px">1 &nbsp; ② &nbsp; 3 &nbsp; Next ›</p>',"reviews")},
tasks:function(){var k=Object.keys(TASKS).map(function(s){return '<div><div class="chip" style="display:inline-block;margin-bottom:14px">'+s+'</div><div class="list">'+TASKS[s].map(function(t){return '<div class="item"><span>'+t[0]+'<br><small>'+t[2]+'</small></span><span>★ '+t[1]+'</span></div>'}).join("")+'</div></div>'}).join("");
  return shell('<h1>Task Management</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'+k+'</div>',"tasks")},
chat:function(){return shell('<h1>Chat</h1><div class="chat"><div id="cl"></div><div><div id="cm" style="min-height:300px"></div><div style="display:flex;gap:10px;margin-top:12px"><input id="ci" placeholder="Send Message" style="flex:1" onkeydown="if(event.key===\'Enter\')send()"><button class="btn p" onclick="send()">Send</button></div></div></div>',"chat")},
notifications:function(){return shell('<h1>Notifications</h1><div class="chips"><span class="chip">Unread</span><span class="chip">Read</span></div><div class="list">'+NOTES.map(function(n){return '<div class="item"><span>'+n[1]+'<br><small>'+n[2]+'</small></span><span>'+n[0]+'</span></div>'}).join("")+'</div>',"")},
profile:function(){var f=[["User ID","id"],["User Name","name"],["Email Id","email"],["Designation","role"],["Location","loc"]];
  var b=editing?f.map(function(x){return '<label>'+x[0]+'<input id="f_'+x[1]+'" value="'+USER[x[1]]+'" style="width:100%;margin-top:4px"></label>'}).join("")+'<div style="display:flex;gap:16px"><button class="btn p" onclick="saveP()">Update and Save</button><button class="btn" onclick="editing=false;render()">Cancel</button></div>':f.map(function(x){return '<p style="margin:0">'+x[0]+' : '+USER[x[1]]+'</p>'}).join("")+'<div><button class="btn p" onclick="editing=true;render()">EDIT PROFILE</button></div>';
  return shell('<h1>'+(editing?'Edit Profile Details':'Profile Details')+'</h1><div class="form" style="gap:20px">'+b+'</div>',"")},
settings:function(){return shell('<h1>Settings &amp; Application Information</h1><div class="form" style="max-width:none;gap:22px"><div style="display:flex;gap:16px;align-items:center">Notifications <button class="sw '+(notifOn?'on':'')+'" aria-label="Toggle notifications" onclick="notifOn=!notifOn;render()"></button></div><p style="margin:0">App. Details – This application is developed for Enterprise Product Teams to analyze Product’s Customer Reviews and do enhancement based on it. It induces Customer Satisfaction.</p><p style="margin:0">App. Version – 1.0</p><p style="margin:0">App. Launched Year – 2022</p></div>',"settings")},
support:function(){return shell('<h1>Application Support Details</h1><div class="form" style="max-width:none;gap:24px"><p style="margin:0">Email Id : ericson@enterprise.com</p><p style="margin:0">Contact Number: +63 9324387284</p></div>',"support")}
};
function render(){
  var h=(location.hash||"#login").slice(1);if(!V[h])h="login";if(h==="login")authed=false;if(!authed&&h!=="login"&&h!=="forgot"){location.hash="login";return}
  $("#root").innerHTML=V[h]();
  if(h==="reviews")filt();
  if(h==="chat")drawChat();
  window.scrollTo(0,0);
}
function filt(){var q=($("#q")||{value:""}).value.toLowerCase();
  $("#tb").innerHTML=REV.filter(function(r){return r.join(" ").toLowerCase().indexOf(q)>-1}).map(function(r){return '<tr><td>● '+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td></tr>'}).join("")}
function exp(){try{var t=REV.map(function(r){return r.join(",")}).join("\n");navigator.clipboard.writeText(t);alert("Reviews copied to clipboard as CSV.")}catch(e){alert("Export is not available here.")}}
function drawChat(){
  $("#cl").innerHTML=Object.keys(CHATS).map(function(n){return '<div class="item" style="cursor:pointer;margin-bottom:10px;'+(n===chatWith?'outline:2px solid var(--accent)':'')+'" onclick="chatWith=\''+n+'\';msgs=[];drawChat()"><span>'+n+'<br><small>'+CHATS[n][0]+'</small></span></div>'}).join("");
  $("#cm").innerHTML='<div class="msg"><b>'+chatWith+'</b><br>'+CHATS[chatWith][0]+'</div>'+msgs.map(function(m){return '<div class="msg me">'+m+'</div>'}).join("")}
function send(){var i=$("#ci"),v=i.value.trim();if(!v)return;msgs.push(v.replace(/[<>&]/g,""));i.value="";drawChat()}
var authed=false;
function doLogin(){var u=$("#u").value.trim().toLowerCase(),p=$("#p").value;
  if((u==="ericson palaganas"||u==="ericson@enterprise.com")&&p==="1q2w3e4r5t"){authed=true;location.hash="dashboard"}else{$("#err").textContent="Incorrect username or password."}}
function saveP(){["id","name","email","role","loc"].forEach(function(k){USER[k]=$("#f_"+k).value.replace(/[<>"&]/g,"")});editing=false;render()}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
